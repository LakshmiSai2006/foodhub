<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FoodHub Admin Login</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff8f2;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 360px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 5px 25px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #e85d04;
        }

        p {
            text-align: center;
            color: #777;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;

            border: 1px solid #ddd;

            border-radius: 8px;

            box-sizing: border-box;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #e85d04;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #d94f00;
        }

        .error {
            background: #ffe5e5;

            color: #c62828;

            padding: 10px;

            border-radius: 8px;

            margin-top: 15px;

            text-align: center;
        }

    </style>

</head>

<body>


    <div class="login-box">

        <h1>🍴 FoodHub</h1>

        <p>Admin Login</p>


        {% if error %}

        <div class="error">

            {{ error }}

        </div>

        {% endif %}


        <form method="POST">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <button type="submit">

                🔐 Login

            </button>

        </form>

    </div>


</body>

</html>
